# Fabula Board APK 构建（云端，替代本地 Android SDK 环境）
# 触发：android/ 或图标源变动推送 master、手动 workflow_dispatch、GitHub Release 创建（附 APK）
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'tools/make-icon.mjs'
      - '.github/workflows/android.yml'
  release:
    types: [created]

permissions:
  contents: write   # release 上传需要写入

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          # runner 镜像通常已含 android-34 / build-tools;34.0.0（licenses 已接受）；
          # 缺失时才走 sdkmanager（其不在默认 PATH，需用完整路径探测）
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -f "$SDK/platforms/android-34/android.jar" ] && [ -x "$SDK/build-tools/34.0.0/aapt2" ]; then
            echo "android-34 + build-tools;34.0.0 already present on runner"
          else
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMGR" ]; then
              SDKMGR="$(find "$SDK" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)"
            fi
            [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ] || { echo "sdkmanager not found under $SDK"; exit 1; }
            echo "installing via $SDKMGR"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "--- platforms:"; ls "$SDK/platforms"
          echo "--- build-tools:"; ls "$SDK/build-tools"

      - name: Build APK
        run: bash android/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fabula-Board-APK
          path: android/build/Fabula-Board.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" android/build/Fabula-Board.apk --clobber
